name: Manual Build

on:
  workflow_dispatch:

jobs:
  build:
    name: build dist files
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18

    - run: npm ci
      working-directory: static

    - run: npm run build
      working-directory: static

    - uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: install build
      run: python -m pip install --upgrade build

    - name: build dist
      run: python -m build

    - uses: actions/upload-artifact@v4
      with:
        name: build-files-temp
        path: dist/*
        if-no-files-found: error

  upload-individual:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJSON(needs.build.outputs.files) }}  # 这里动态生成文件列表
    steps:
      - name: Download temp artifact
        uses: actions/download-artifact@v4
        with:
          name: build-files-temp
          path: build

      - name: Upload single file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: build/${{ matrix.file }}

  release:
    name: Create GitHub Release
    needs: build
    if: ${{ github.event.inputs.tag != '' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: dist

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.inputs.tag }}
        release_name: Release ${{ github.event.inputs.tag }}
        draft: false
        prerelease: false

    - name: Upload each file as release asset
      run: |
        for f in dist/*; do
          name=$(basename "$f")
          echo "Uploading $f as $name"
          gh release upload "${{ steps.create_release.outputs.tag_name }}" "$f"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
